# Alembic configuration for JobOS

[alembic]
# Path to migration scripts
script_location = infra/db/migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Sys.path prepend
prepend_sys_path = .

# Default timezone for generated migration files
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Default database url (overridden dynamically in env.py via settings)
sqlalchemy.url = postgresql://jobos:jobos_password@localhost:5432/jobos

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
